site_name: GeOSINT Field Wiki
site_description: Sourced reference for geographical OSINT — identification features, regions, landmarks, methodology.
site_url: ""
use_directory_urls: true

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: light blue
  font:
    text: Segoe UI
    code: Cascadia Code
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tooltips
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tasklist

nav:
  - Home: index.md
  - Methodology:
      - Geolocation workflow: methodology/workflow.md
      - Chronolocation (sun & shadows): methodology/chronolocation.md
      - Chronolocation cookbook (dating images): methodology/chronolocation-cookbook.md
      - Image verification & EXIF: methodology/verification.md
      - Verification & debunking checklist: methodology/debunking-checklist.md
      - Satellite imagery sourcing: methodology/satellite-sourcing.md
  - Identification features:
      - Driving side: identify/driving-side.md
      - Bollards: identify/bollards.md
      - Utility poles & street lights: identify/utility-poles.md
      - Road markings & lines: identify/road-markings.md
      - Road signs & chevrons: identify/road-signs.md
      - Traffic lights: identify/traffic-lights.md
      - License plates: identify/license-plates.md
      - Flags:
          - National flags: identify/flags.md
          - Subnational & dependency flags: identify/flags-subnational/index.md
          - Cantons of Switzerland: identify/flags-subnational/switzerland.md
          - States of Germany: identify/flags-subnational/germany.md
          - States of the United States: identify/flags-subnational/united-states.md
          - Provinces & territories of Canada: identify/flags-subnational/canada.md
          - Regions of France: identify/flags-subnational/france-regions.md
          - Autonomous communities of Spain: identify/flags-subnational/spain.md
          - Provinces of Spain: identify/flags-subnational/spain-provinces.md
          - Nations of the United Kingdom: identify/flags-subnational/united-kingdom.md
          - States & territories of Australia: identify/flags-subnational/australia.md
          - Dependencies & territories: identify/flags-subnational/dependencies.md
      - Micro-detail catalogues (Commons):
          - Overview: identify/commons/index.md
          - Fire hydrants: identify/commons/fire-hydrants.md
          - Manhole covers: identify/commons/manhole-covers.md
          - Bus stops & shelters: identify/commons/bus-stops.md
          - Electricity pylons: identify/commons/pylons.md
          - Chevrons & guardrails: identify/commons/chevrons.md
      - Architecture by region: identify/architecture.md
      - Vegetation & climate: identify/vegetation-climate.md
      - Languages & scripts: identify/language-scripts.md
      - Internet domains & phone codes: identify/domains-phones.md
      - Street View meta (cars, cameras, coverage): identify/streetview-meta.md
  - World reference:
      - Quick-reference table: world/index.md
      - Europe: world/europe.md
      - Asia: world/asia.md
      - Africa: world/africa.md
      - North & Central America: world/north-america.md
      - South America: world/south-america.md
      - Oceania: world/oceania.md
  - Landmarks:
      - Natural landmarks: landmarks/natural.md
      - Man-made landmarks: landmarks/manmade.md
  - Datasets:
      - Databases catalogue: data/databases.md
      - UNESCO sites: data/unesco.md
      - National parks: data/national-parks.md
      - Castles & palaces: data/castles.md
      - Airports: data/airports.md
  - Botanical reference:
      - Overview: flora/index.md
      - Boreal & northern: flora/boreal-northern.md
      - Temperate: flora/temperate.md
      - Mediterranean: flora/mediterranean.md
      - Arid & desert: flora/arid-desert.md
      - Tropical: flora/tropical.md
      - East Asia: flora/east-asia.md
      - Oceania & Americas: flora/oceania-americas.md
      - Crops & landscape: flora/crops-landscape.md
      - Coastal: flora/coastal.md
  - Sources & databases: sources.md
