name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run unit tests (server is pure stdlib)
        run: python -m pytest tests/ -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (smoke)
        run: docker build -t geosint:ci .
      - name: Run + probe /api/status
        run: |
          docker run -d --name g -p 8650:8650 geosint:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8650/api/status || true)
            [ "$code" = "200" ] && break; sleep 1
          done
          curl -fsS http://localhost:8650/api/status | grep -q '"platform": "Linux"'
          docker rm -f g
