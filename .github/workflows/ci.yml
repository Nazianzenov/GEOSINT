name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run unit tests (server is pure stdlib; browser tests run in the js-tests job)
        run: python -m pytest tests/ -q --ignore=tests/test_js.py

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Browser-driven tests for app.js core logic (esc, parseCoords, dossier escaping)
        run: python -m pytest tests/test_js.py -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit the build toolchain for known CVEs
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt -r requirements-build.txt || true   # report, don't block

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (smoke)
        run: docker build -t geosint:ci .
      - name: Run + probe /api/status
        run: |
          docker run -d --name geosint-ci -p 8650:8650 geosint:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8650/api/status || true)
            [ "$code" = "200" ] && break; sleep 1
          done
          curl -fsS http://localhost:8650/api/status | grep -q '"platform": "Linux"'
          docker rm -f geosint-ci
