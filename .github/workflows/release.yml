name: release

# On a version tag (v1.2.3): build a portable executable on each OS (PyInstaller
# does not cross-compile, so each runner builds its own), build + push the Docker
# image, and attach everything to a GitHub Release with checksums.
on:
  push:
    tags: ["v*"]

# Least privilege: read-only by default; only the job that needs a write scope
# gets it (the exe builds pip-install third-party packages and must not hold one).
permissions:
  contents: read

jobs:
  build-exe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: geosint-windows.exe
            bin: dist/geosint.exe
          - os: macos-latest
            artifact: geosint-macos
            bin: dist/geosint
          - os: ubuntu-latest
            artifact: geosint-linux
            bin: dist/geosint
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt
      - name: Build wiki + search index
        # Data + localized pages are committed: no fetch (it re-hotlinked Wikimedia).
        # bash (-e) on every runner so a failing step fails the job; pwsh would not.
        shell: bash
        run: |
          mkdocs build -f wiki/mkdocs.yml
          python tools/build_search_index.py
      - name: Build portable executable
        run: pyinstaller --noconfirm --clean geosint.spec
      - name: Rename + checksum
        shell: bash
        run: |
          mv "${{ matrix.bin }}" "dist/${{ matrix.artifact }}"
          cd dist && shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push the image to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9   # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  release:
    needs: [build-exe, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release + upload assets
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
