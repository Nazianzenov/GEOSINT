<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeOSINT — Knowledge Graph</title>
<link rel="stylesheet" href="css/app.css">
<style>
  body { overflow: hidden; }
  #g-top { display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--bg-1);
           border-bottom:1px solid var(--line); }
  #g-top .brand a { color:var(--txt); text-decoration:none; }
  #legend { display:flex; gap:14px; font:11px var(--mono); color:var(--txt-dim); flex:1; }
  #legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; }
  #graph { position:absolute; inset:47px 0 0 0; }
  #g-hint { position:fixed; bottom:10px; left:14px; font:11px var(--mono); color:var(--txt-dim); z-index:10; }
</style>
</head>
<body>
<div id="g-top">
  <div class="brand"><a href="index.html">◢ Ge<span class="brand-o">OSINT</span></a>
    <span class="brand-sub">KNOWLEDGE GRAPH</span></div>
  <div id="legend">
    <span><i style="background:#4cc2ff"></i>category</span>
    <span><i style="background:#ffb454"></i>country</span>
    <span><i style="background:#7ee787"></i>continent</span>
    <span style="margin-left:8px">node size = number of wiki cards · click a node to search it</span>
  </div>
  <a class="wiki-btn" href="search.html">⌕ SEARCH</a>
  <a class="wiki-btn" href="/wiki/" target="_blank">⌘ WIKI</a>
</div>
<div id="graph"></div>
<div id="g-hint">drag to pan · wheel to zoom · hover for counts</div>
<script src="vendor/force-graph.min.js"></script>
<script>
"use strict";
const COLORS = { category: "#4cc2ff", country: "#ffb454", continent: "#7ee787" };
fetch("data/graph.json").then(r => r.json()).then(data => {
  // log-capped radius: a 5,000-card category must not become a blob
  const radius = n => Math.min(16, 3 + Math.log2(n.count + 1) * 1.5);
  let fitted = false;
  const g = ForceGraph()(document.getElementById("graph"))
    .graphData(data)
    .backgroundColor("#0b0e14")
    .nodeId("id")
    .nodeLabel(n => `${n.label} — ${n.count} cards`)
    .nodeVal(n => radius(n))
    .nodeRelSize(1)
    .nodeCanvasObjectMode(() => "after")
    .nodeCanvasObject((n, ctx, scale) => {
      // label culling: categories & continents always; countries when zoomed
      // in or significant. Dark halo keeps text readable over links.
      if (n.kind === "country" && scale < 1.3 && n.count < 150) return;
      const size = Math.max(8.5, 11 / scale);
      ctx.font = `${n.kind === "country" ? "" : "600 "}${size}px Segoe UI`;
      ctx.textAlign = "center";
      ctx.lineWidth = Math.max(2, 4 / scale);
      ctx.strokeStyle = "#0b0e14";
      ctx.strokeText(n.label, n.x, n.y - radius(n) - 3);
      ctx.fillStyle = n.kind === "country" ? "#aeb7c8" : "#e8edf5";
      ctx.fillText(n.label, n.x, n.y - radius(n) - 3);
    })
    .nodeColor(n => COLORS[n.kind] || "#8a93a6")
    .linkColor(() => "#2b3450")
    .linkWidth(l => Math.min(2.5, 0.4 + Math.sqrt(l.w) / 6))
    .onNodeClick(n => {
      if (n.kind === "category") location.href = "search.html?cat=" + encodeURIComponent(n.id.slice(2));
      else if (n.kind === "country") location.href = "search.html?country=" + encodeURIComponent(n.label);
      else if (n.kind === "continent") location.href = "search.html?continent=" + encodeURIComponent(n.label);
    })
    .onEngineStop(() => { if (!fitted) { fitted = true; g.zoomToFit(500, 70); } });
  g.d3Force("charge").strength(-180).distanceMax(450);
  g.d3Force("link").distance(l => 35 + 120 / Math.sqrt(l.w || 1));
  setTimeout(() => { if (!fitted) g.zoomToFit(400, 70); }, 1200);  // early frame
});
</script>
</body>
</html>
