<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeOSINT — Wiki Search</title>
<link rel="stylesheet" href="css/app.css">
<style>
  /* Standalone-page chrome only. The search UI itself is styled by the shared
     .geosearch rules in app.css (so the docked workbench panel looks identical). */
  body { overflow: auto; }
  #s-top { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--bg-1);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50; }
  #s-top .brand a { color: var(--txt); text-decoration:none; }
  #s-top .s-q { flex:1; max-width:680px; }
  #geosearch { display:block; }
  /* on the full-width page, let the search sidebar stick under the top bar */
  #geosearch .s-side { position:sticky; top:54px; }
</style>
</head>
<body>
<div id="s-top">
  <div class="brand"><a href="index.html" title="Back to Workbench">◢ Ge<span class="brand-o">OSINT</span></a>
    <span class="brand-sub">WIKI SEARCH</span></div>
  <a class="wiki-btn" href="graph.html">▦ MATRIX</a>
  <a class="wiki-btn" href="/wiki/" target="_blank">⌘ WIKI</a>
</div>
<div id="geosearch" class="geosearch"></div>
<script src="vendor/minisearch.umd.js"></script>
<script src="js/search.js"></script>
<script>
  // Standalone page: mount with no onPick, so result cards use the #ll= deep link
  // (open the workbench in a new tab at the coordinate). Read q/country/etc. from
  // the URL after mount for shareable links.
  GeoSearch.mount(document.getElementById("geosearch")).then((ui) => {
    const p = new URLSearchParams(location.search);
    if (p.get("q")) { ui.$(".s-q").value = p.get("q"); }
    if (p.get("country")) ui.state.country = p.get("country");
    if (p.get("continent")) ui.state.continent = p.get("continent");
    if (p.get("cat")) ui.state.cats.add(p.get("cat"));
    ui.run();
    ui.$(".s-q").focus();
    // keep ?q= in the URL for sharable searches
    ui.$(".s-q").addEventListener("input", () => {
      const url = new URL(location); const v = ui.$(".s-q").value.trim();
      v ? url.searchParams.set("q", v) : url.searchParams.delete("q");
      history.replaceState(null, "", url);
    });
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); GeoSearch.focus(); }
  });
</script>
</body>
</html>
