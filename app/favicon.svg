<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GeOSINT Workbench">
  <!-- Reticle over the workbench's dark chrome: reads at 16px, and the opaque
       disc keeps it legible on light browser chrome too. Colours are the app
       palette (--bg-1 / --accent / --accent-2 in app/css/app.css). -->
  <rect width="32" height="32" rx="7" fill="#11151f"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#4cc2ff" stroke-width="2.5"/>
  <path d="M16 3.5v5.5M16 23v5.5M3.5 16h5.5M23 16h5.5"
        stroke="#4cc2ff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2.75" fill="#ffb454"/>
</svg>
